<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>share image</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600&family=Silkscreen:wght@400;700&display=block">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #f5f2ea; }
  .half { position: absolute; inset: 0; }
  .half img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .light { background: #faf9f5; }
  .dark { background: #262624; clip-path: polygon(64% 0, 100% 0, 100% 100%, 36% 100%); }
  .label { position: absolute; left: 64px; top: 56px; font: 700 26px/1 Silkscreen, monospace; letter-spacing: .04em; color: #1d1b16; display: flex; align-items: center; gap: 14px; }
  .label svg { width: 34px; height: 34px; fill: #d9466f; }
  .title { position: absolute; left: 64px; top: 112px; max-width: 640px; font: 600 76px/1.02 'IBM Plex Sans', sans-serif; letter-spacing: -.02em; color: #1d1b16; }
  .sub { position: absolute; left: 64px; top: 206px; font: 500 26px/1.3 'IBM Plex Sans', sans-serif; color: #4a463c; max-width: 540px; }
  .site .title { font-size: 70px; top: 118px; max-width: 560px; }
  .site .sub { top: 300px; }
  .mode { position: absolute; top: 40px; font: 700 18px/1 Silkscreen, monospace; letter-spacing: .06em; }
  .mode.l { right: 470px; color: #6d675a; display: none; }
  .mode.d { right: 56px; color: #c9c6bb; }
</style>
</head>
<body>
<div class="half light"><img id="light" alt=""></div>
<div class="half dark"><img id="dark" alt=""></div>
<div class="label"><svg viewBox="0 0 16 16" shape-rendering="crispEdges"><rect x="5" y="3" width="6" height="1"/><rect x="4" y="4" width="8" height="1"/><rect x="3" y="5" width="10" height="2"/><rect x="3" y="8" width="10" height="1"/><rect x="4" y="10" width="8" height="1"/><rect x="0" y="12" width="16" height="1"/><rect x="2" y="14" width="12" height="1"/></svg>Backdrop Club</div>
<div class="title" id="title"></div>
<div class="sub" id="sub"></div>
<div class="mode d">LIGHT + DARK</div>
<script>
  const q = new URLSearchParams(location.search)
  const id = q.get('id')
  const title = q.get('title')
  const author = q.get('author')
  if (!title) {
    document.body.classList.add('site')
    document.getElementById('title').textContent = 'Backdrops for your Claude app'
    document.getElementById('sub').textContent = 'Free pixel-art themes, light and dark.'
  } else {
    document.getElementById('title').textContent = title
    document.getElementById('sub').textContent = author ? `A Claude app backdrop by @${author}` : 'A Claude app backdrop'
  }
  const images = ['light', 'dark'].map(mode => new Promise(resolve => {
    const img = document.getElementById(mode)
    img.onload = img.onerror = resolve
    img.src = `../t/${id}/${mode}.svg`
  }))
  Promise.all([...images, document.fonts.ready]).then(() => requestAnimationFrame(() => requestAnimationFrame(() => { window.ready = true })))
</script>
</body>
</html>
